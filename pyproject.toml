[project]
name = "ima-kb-mcp"
version = "1.0.0"
description = "MCP server for Tencent IMA Knowledge Base - search, list, and read knowledge base documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
ima-kb-mcp = "ima_kb_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ima_kb_mcp"]